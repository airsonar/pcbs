site_name: AirSonar PCBs

nav:
  - Overview: index.md
  - Microphone arrays:
    - 8-channel PDM (v1): microphone_array/airsonar_pdm8_v1.md

theme:
  name: material
  features:
    - content.footnote.tooltips
    - navigation.tabs
    - navigation.tabs.sticky
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences

hooks:
  - docs/genzip.py
  - docs/kipdf.py
